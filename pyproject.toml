[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "photomancy"
description = "Divination from light: Bayesian inference and value-of-information for HWO direct imaging"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # >=1.6: the MCLMC tuner requires logdensity_fn from 1.6 on, and 1.5 does
    # not accept the keyword, so the two cannot be supported by one call.
    "blackjax>=1.6",
    "equinox>=0.13.2",
    "hwoutils>=1.10.0",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    # jaxctx supplies the prior interface the jaxns 3 adapter subclasses.
    "jaxctx>=1.2.0",
    "jaxns>=3.0.0",
    "numpy>=2.1.2",
    # Older NumPyro releases import JAX APIs that are deprecated or removed.
    "numpyro>=0.21.0",
    "optax>=0.2.3",
    # >=3.0.0: raw positions and velocities use (east, north, away).
    "orbix>=3.0.0",
    # >=2.1.0: scene states and the disk chart use the same (east, north) sky
    # chart as orbix 3, so an older skyscapes must not install beside photomancy.
    "skyscapes>=2.1.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.6"]
docs = [
    "sphinx>=7.3.7",
    "myst-nb>=1.1",
    "sphinx-book-theme>=1.1.3",
    "sphinx-autoapi>=3.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx_autodoc_typehints>=2.0",
    "ipython>=8.18",
    # numpyro imports tqdm.auto, which warns on stderr in a kernel without widgets.
    "ipywidgets>=8.1.1",
    "hwostyle>=1.7.0",
    "matplotlib>=3.11",
    "eyepiece>=0.1.0",
]
# Include the plotting dependencies directly so viz tests run without a recursive
# self-version constraint, including in shallow VCS checkouts.
test = [
    "pytest>=7.3.2",
    "pytest-xdist>=2.5",
    "hypothesis>=6.79.1",
    "pytest-cov>=1.0",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "packaging>=24.2",
    "scipy>=1.13",
    # jaxns uses this provider of tensorflow_probability.
    "tfp-nightly>=0.26.0.dev20260621",
    "eyepiece>=0.1.0",
    "matplotlib>=3.11",
]
# Optional extras (jaxns and numpyro are core deps, not extras):
imaging = ["coronalyze>=1.2.0"]  # differentiable detection/extraction likelihood helpers
# eyepiece>=0.1.0 carries every interface photomancy.viz calls (corner,
# corner_overlay, sky_fan, cov_ellipse, save_fig, PlotResult); checked by
# interface in the test suite rather than by version string.
viz = ["eyepiece>=0.1.0", "matplotlib>=3.11"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/photomancy"
Issues = "https://github.com/CoreySpohn/photomancy/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/photomancy/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/photomancy"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.ruff.lint.per-file-ignores]
# Tutorial notebooks: docstring rules and import-position rules are noise in
# cell-structured code.
"docs/**" = ["D", "E402"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF", "NPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol_colors initializes colormaps with Matplotlib's deprecated set_bad API.
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:tol_colors",
    # TFP's JAX backend still registers ndarray via JAX's deprecated core alias.
    "ignore:jax[.]core[.]pytype_aval_mappings is deprecated[.]:DeprecationWarning:tensorflow_probability.python.internal.backend.jax.ops",
    # HAPI's regex literals contain invalid escapes on Python 3.12.
    "ignore:invalid escape sequence.*:SyntaxWarning:.*/hapi/hapi$",
    # ExoJAX's regex and math docstrings contain non-raw escapes on Python 3.12.
    "ignore:invalid escape sequence.*:SyntaxWarning:.*/exojax/(utils/isotopes|opacity/_common/lsd|database/core_atom/broadening|database/mie|atm/atmprof|rt/toon|rt/twostream)$",
    # Vaex's regex examples and plotting expressions contain non-raw escapes.
    "ignore:invalid escape sequence.*:SyntaxWarning:.*/vaex/(functions|viz/mpl|viz/contour)$",
    # ExoJAX's HITRAN import redirects stdout to an unclosed /dev/null handle.
    "ignore:unclosed file .*name='/dev/null'.*:ResourceWarning:exojax.database._common.hitranapi",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "photomancy"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["photomancy"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "jaxlib",  # JAX loads its compiled backend; retain the explicit version floor.
    "skyscapes",  # Disk and atmosphere fits consume user-supplied skyscapes models.
    "coronalyze",  # The imaging extra supplies user-defined detection forwards.
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/photomancy"]
